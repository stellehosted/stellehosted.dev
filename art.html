<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art | stellehosted.dev</title>
<link rel="icon" href="/branding/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/branding/favicon.png" type="image/png" sizes="256x256">
<link rel="apple-touch-icon" href="/branding/apple-touch-icon.png">
<link rel="stylesheet" href="/lib/font.css">
<link rel="stylesheet" href="/lib/sidebar.css">
<link rel="stylesheet" href="/lib/glass.css">
<style>
  /* Same unit system as home.html: 1rem == 1 real Sketch unit on the 1920x1080 canvas, so every measurement below is the Sketch ("Art" frame) value / 19.2. Asset URLs are absolute because this page is served at /art (and /art/). */
  /* The document itself scrolls (no inner scroll box): a position:fixed scroller would be an
     isolated group, and the glass rims' overlay blend (glass.js) would stop seeing the page. */
  html {
    font-size: min(1vw, 1.7778vh);
    scrollbar-width: none;
  }
  html::-webkit-scrollbar { display: none; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #06060c;
    font-family: 'FuturaNowHeadline', sans-serif;
    color: #fff;
  }
  a { color: inherit; text-decoration: none; }

  .bg {
    position: fixed; inset: 0; z-index: -1;   /* under the in-flow content */
    background-image: url('/branding/Banner (Personal).png');
    background-size: cover;
    background-position: center;
  }

  /* ===== layers, back to front (DOM order): .bg (fixed, z -1), the content (scrolls with the
     document), then the sidebar (its blur strip + nav, from sidebar.js), then the dock (appended to
     <body> by dock.js, along with its own blur strip). Neither component has a transform / z-index,
     or the dock rims' overlay blend would stop seeing the page. They rely on being later in the DOM
     to paint over the content. */

  /* Content column: x=502, first heading 100px (5.208rem) below the top of the *window*, so on a
     tall window it doesn't sink into the letterbox bar the way the centered sidebar does. Bottom
     padding lets the last row scroll clear of the dock. */
  .content {
    position: relative;
    width: 67.708rem;
    margin-left: calc(50% - 50rem + 26.146rem);
    padding: 5.208rem 0 12rem;
  }
  .content section { scroll-margin-top: 5.208rem; }
  .content h2 { font-size: 2.0833rem; }   /* 40px; class="glow-text" comes from sidebar.css */

  /* OC's: 385x500 cards, gap 32, in a Glass (Secondary) panel (glass.css: radius 24, padding 40).
     The card shape is fixed; the panel shrinks to fit fewer than three and wraps more. */
  .ocs {
    display: flex; flex-wrap: wrap; gap: 1.667rem;
    width: fit-content; max-width: 100%;
    margin-top: 1.042rem;
    padding: 2.083rem;
  }
  .card-hit { flex: 0 0 auto; width: 20.069rem; }   /* a real width, so the panel's fit-content sees it */
  .card {
    position: relative; display: block; width: 100%;
    aspect-ratio: 385 / 500;
    border-radius: 0.417rem;
    overflow: hidden;
    background: linear-gradient(to bottom right, var(--from), var(--to));
  }
  /* The art fills the card. A cut-out (transparent png) gets the Sketch "Hero" offset shadow in the
     card's start color; on an opaque image it's hidden behind the image itself. */
  .card > img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    filter: drop-shadow(-1.042rem -0.417rem 0 var(--from, transparent));
  }
  /* "Name BG": 137px frosted band, slanted top edge (points from the Sketch shape) */
  .card-band {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 7.167rem;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(0.833rem);
    -webkit-backdrop-filter: blur(0.833rem);
    clip-path: polygon(0 100%, 0 44.78%, 99.83% 0, 100% 100%);
  }
  .card-name {
    position: absolute; right: 2.5rem; bottom: 1.667rem;
    font-size: 2.0833rem; font-weight: 700; line-height: 1.1;
    color: #fff;
    /* 4px outside stroke: a centered stroke of 8px painted *under* the fill */
    -webkit-text-stroke: 0.4167rem #141414;
    paint-order: stroke fill;
    stroke-linejoin: round;
  }

  /* More: a timeline of rows of art cards.
     Each row: [date, right-aligned to x=570] 15 [16px timeline] 49 [cards, gap 32, 1152 wide].
     Every card's photo is the same height (447, as in Sketch); its width follows the art's aspect
     ratio, and the script fills each row with as many cards as fit the 1152. */
  .more { margin-top: 4.375rem; }   /* 84 below the OC panel */
  .rows { margin-top: 1.042rem; }
  .row {
    display: grid;
    grid-template-columns: 3.542rem 0.781rem 0.833rem 2.552rem 1fr;
  }
  /* Year links land on a card; the extra 16px puts its row's dot at the usual 100px from the top. */
  .row-cards > .art-hit { scroll-margin-top: calc(5.208rem + 0.833rem); }
  .row-date {
    grid-column: 1; justify-self: end;
    margin-top: 0.208rem;
    font-size: 1.0417rem; line-height: 1.2; white-space: nowrap;
  }
  /* The timeline: a 16px dot at the top of each row, and a 5px line from it down to the next row's
     dot. The last row closes with a second dot just below it, so the line never trails off. */
  .row-tl { grid-column: 3; position: relative; }
  .row-tl::before, .row-end {
    content: "";
    position: absolute; left: 0; top: 0;
    width: 0.833rem; height: 0.833rem;
    border-radius: 50%;
    background: #fff;
  }
  .row-tl::after {
    content: "";
    position: absolute; left: calc(50% - 0.13rem); top: 0.833rem; bottom: 0;
    width: 0.26rem;
    background: #fff;
  }
  .row-end { top: 100%; }
  .row:not(:last-child) .row-end { display: none; }
  /* Cards start 16px below the dot; 16px under them (+16 at the top of the next row) makes the
     32px row gap. */
  .row-cards {
    grid-column: 5;
    display: flex; gap: 1.667rem; align-items: flex-start;
    padding: 0.833rem 0;
  }

  /* Art card: Glass (Secondary), radius 16. Photo 447 tall; the card's width is set inline from the
     file's size (see renderCard), so the box is the right shape before its image has loaded. Then
     the title and date. Behind the photo sits a 25.6px-blurred copy of it, which bleeds the art's
     colors down into the frosted area under it. */
  .art-hit .art-fx { display: block; position: relative; width: 16.667rem; }   /* 320 when the size is unknown */
  .art-card {
    --glass-radius: 0.833;
    position: relative;
    display: flex; flex-direction: column; gap: 0.833rem;
    padding-bottom: 0.833rem;
    overflow: hidden;
    transition: box-shadow 0.15s ease;
  }
  .art-photo {
    position: relative;
    height: 23.281rem;   /* 447 */
    border-radius: 0.417rem;
    overflow: hidden;
  }
  .art-photo > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .art-blur {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 23.281rem;
    object-fit: cover;
    filter: blur(1.333rem);
  }
  .art-info {
    position: relative;
    display: flex; flex-direction: column; gap: 0.417rem;
    padding: 0 0.833rem;
    text-align: center;
  }
  .art-title { font-size: 1.0417rem; font-weight: 400; line-height: 1.2; }   /* 20/24 */
  .art-date { font-size: 0.625rem; line-height: 1.1; color: rgba(255,255,255,0.5); }   /* 12px, 50% */
  /* Off-screen images have their src removed (see the observer in the script): no alt-text flash. */
  img:not([src]) { visibility: hidden; }

  /* Hover glow (fx.css): .art-hit is the hitbox and stays put, the art inside it (.fx) scales and
     glows. The button is a sibling of the art, not inside it, so it keeps its clicks (.fx is
     pointer-transparent). A gentler scale than the default: the art is big, and the OC cards would
     otherwise overlap their neighbors. On a glass art card the glow is a box-shadow instead of
     fx's drop-shadow filter: a filter would cut the card's background blur off from the page. */
  .art-hit { position: relative; --fx-scale: 1.04; }
  .art-hit.fx-hit:hover .art-fx { filter: none; }
  .art-hit.fx-hit:hover .art-card {
    box-shadow:
      0 0 0.417rem rgba(255,255,255,0.9),
      0 0 2.5rem rgba(255,255,255,0.12),
      inset 0 0 1.25rem rgba(255,255,255,0.32);
  }
  /* Every card opens the viewer: an invisible button covers it. */
  .art-open {
    position: absolute; inset: 0; width: 100%; height: 100%;
    padding: 0; border: 0; background: none; cursor: pointer;
  }
  .art-open:focus-visible { outline: 0.208rem solid #fff; outline-offset: 0.208rem; border-radius: 0.833rem; }
  /* "3 images" pill on art that opens into a carousel */
  .multi-badge {
    position: absolute; top: 0.833rem; right: 0.833rem;
    padding: 0.208rem 0.625rem; border-radius: 1rem;
    font-size: 0.833rem; font-weight: 700; line-height: 1.4;
    background: rgba(0,0,0,0.55);
    pointer-events: none;
  }

  /* ===== viewer: a modal <dialog> (Esc, focus trap and the inert page behind it come for free) =====
     Image / carousel on the left, title + date + description on the right. */
  .viewer {
    padding: 0; border: 0;
    max-width: none; max-height: none;
    font-family: inherit; color: #fff;
  }
  .viewer[open] {
    display: grid; grid-template-columns: minmax(0, 1fr) 22.917rem; grid-template-rows: minmax(0, 1fr);
    width: 72rem; height: 46rem;
    margin: auto;
    overflow: hidden;
    border-radius: 0.625rem;
    background: rgba(14,14,22,0.8);
    backdrop-filter: blur(1.667rem); -webkit-backdrop-filter: blur(1.667rem);
    box-shadow: 0 0 3.333rem rgba(0,0,0,0.6);
  }
  .viewer::backdrop { background: rgba(0,0,0,0.55); backdrop-filter: blur(0.625rem); -webkit-backdrop-filter: blur(0.625rem); }
  .viewer-stage {
    position: relative; min-width: 0;
    background: rgba(0,0,0,0.3);
    touch-action: pan-y;
  }
  .viewer-stage img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: contain; transition: opacity 0.2s ease; }
  .viewer-stage img:not(.ready) { opacity: 0; }   /* no broken-image alt text while a big file loads */
  .viewer button { font: inherit; color: #fff; cursor: pointer; border: 0; }
  .viewer button:focus-visible { outline: 0.208rem solid #fff; outline-offset: 0.104rem; }
  .v-nav, .v-close {
    position: absolute;
    display: grid; place-items: center;
    width: 2.5rem; height: 2.5rem; padding: 0; border-radius: 50%;
    background: rgba(0,0,0,0.45);
    transition: background 0.15s ease;
  }
  .v-nav:hover, .v-close:hover { background: rgba(0,0,0,0.7); }
  .v-nav svg, .v-close svg { width: 1.25rem; height: 1.25rem; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .v-nav { top: calc(50% - 1.25rem); }
  .v-prev { left: 0.833rem; }
  .v-next { right: 0.833rem; }
  .v-close { top: 0.833rem; right: 0.833rem; z-index: 1; }
  .v-dots {
    position: absolute; left: 0; right: 0; bottom: 0.833rem;
    width: fit-content; margin: 0 auto;
    display: flex; gap: 0.521rem;
    padding: 0.417rem 0.625rem; border-radius: 1rem;
    background: rgba(0,0,0,0.45);   /* readable on any art */
  }
  .v-dots button { width: 0.625rem; height: 0.625rem; padding: 0; border-radius: 50%; background: rgba(255,255,255,0.4); }
  .v-dots button[aria-current="true"] { background: #fff; }
  .viewer.single .v-nav, .viewer.single .v-dots { display: none; }
  .viewer-info {
    display: flex; flex-direction: column; gap: 0.625rem;
    padding: 3.333rem 2.083rem 2.083rem;
    overflow-y: auto;
  }
  .viewer-title { font-size: 2.0833rem; }
  .viewer-date { font-size: 1.0417rem; opacity: 0.8; }
  .viewer-desc { margin-top: 1.042rem; font-size: 1.0417rem; line-height: 1.6; }
  .viewer-desc p + p { margin-top: 1.042rem; }
  .viewer-desc p { white-space: pre-line; }
  .empty { margin-top: 1.042rem; font-size: 1.0417rem; opacity: 0.6; }
</style>
</head>
<body>

<div class="bg"></div>
<main class="content">

  <section id="ocs">
    <h2 class="glow-text">OC’s</h2>
    <div class="ocs glass-secondary" id="ocs-list"></div>
  </section>

  <section id="more" class="more">
    <h2 class="glow-text">More</h2>
    <div class="rows" id="rows"></div>
  </section>

</main>

<nav class="sidebar">
  <h1 class="sidebar-title">Art</h1>
  <a class="sidebar-heading" href="#ocs">OC’s</a>
  <div class="sidebar-group">
    <a class="sidebar-heading" href="#more">More</a>
    <ul class="sidebar-list" id="years"></ul>
  </div>
</nav>

<dialog class="viewer" id="viewer" aria-labelledby="viewer-title">
  <div class="viewer-stage" id="viewer-stage">
    <img id="viewer-img" alt="">
    <button type="button" class="v-nav v-prev" id="viewer-prev" aria-label="Previous image"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button type="button" class="v-nav v-next" id="viewer-next" aria-label="Next image"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="v-dots" id="viewer-dots"></div>
  </div>
  <div class="viewer-info">
    <h2 class="glow-text viewer-title" id="viewer-title"></h2>
    <time class="viewer-date" id="viewer-date"></time>
    <div class="viewer-desc" id="viewer-desc"></div>
  </div>
  <button type="button" class="v-close" id="viewer-close" aria-label="Close" autofocus><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</dialog>

<script>
  // Content comes from the server's /api/art, which lists whatever is in content/art (see README
  // "Adding content"). Everything is built with textContent / DOM nodes, never innerHTML.
  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  // Art images load as they approach the screen and unload (src removed, so the browser can drop the
  // decoded bitmap) once they're a screen away. Every box is sized up front (fixed aspect ratio), so
  // none of this moves the layout. The observer watches the card, not the src-less <img>s in it.
  const lazy = new IntersectionObserver((entries) => {
    for (const { target, isIntersecting } of entries) {
      for (const image of target.querySelectorAll('img[data-src]')) {
        if (isIntersecting) image.src = image.dataset.src;
        else image.removeAttribute('src');
      }
    }
  }, { rootMargin: '100% 0px' });
  const img = (src, alt) => {
    const node = el('img');
    node.dataset.src = src; node.alt = alt;
    node.decoding = 'async';
    return node;
  };
  const empty = (parent) => parent.appendChild(el('p', 'empty', 'Nothing here yet.'));

  // Wraps a card's art in its hover hitbox (see fx.css): the art gets a "3 images" pill when
  // the entry is a carousel, and the invisible button over it opens the viewer. Returns the hitbox.
  function hitbox(art, entry) {
    art.classList.add('fx');
    if (entry.images.length > 1) art.append(el('span', 'multi-badge', `${entry.images.length} images`));
    const button = el('button', 'art-open');
    button.type = 'button';
    button.setAttribute('aria-label', `View ${entry.title}`);
    button.addEventListener('click', () => openViewer(entry));
    const wrap = el('div', 'art-hit fx-hit');
    wrap.append(art, button);
    return wrap;
  }

  // ---- viewer: a modal <dialog> with a carousel and the description ----
  const viewer = document.getElementById('viewer');
  const viewerImg = document.getElementById('viewer-img');
  const viewerDots = document.getElementById('viewer-dots');
  let shown = null;   // the entry being viewed
  let slide = 0;

  function showSlide(i) {
    const images = shown.images;
    slide = (i + images.length) % images.length;
    viewerImg.classList.remove('ready');
    viewerImg.src = images[slide].src;
    viewerImg.alt = images.length > 1 ? `${shown.title}, image ${slide + 1} of ${images.length}` : shown.title;
    [...viewerDots.children].forEach((dot, n) => dot.setAttribute('aria-current', n === slide));
    if (images.length > 1) new Image().src = images[(slide + 1) % images.length].src;   // warm up the next one
  }

  function openViewer(entry) {
    shown = entry;
    viewer.classList.toggle('single', entry.images.length === 1);
    viewerDots.replaceChildren(...entry.images.map((_, n) => {
      const dot = el('button');
      dot.type = 'button';
      dot.setAttribute('aria-label', `Image ${n + 1}`);
      dot.addEventListener('click', () => showSlide(n));
      return dot;
    }));
    document.getElementById('viewer-title').textContent = entry.title;
    const date = document.getElementById('viewer-date');
    date.textContent = entry.date ? shortDate(entry.date) : '';
    date.hidden = !entry.date;
    if (entry.date) date.dateTime = entry.date;
    // Blank lines separate paragraphs; single line breaks are kept (white-space: pre-line).
    document.getElementById('viewer-desc').replaceChildren(
      ...(entry.description ? entry.description.split(/\n\s*\n/).map((p) => el('p', '', p.trim())) : []));
    showSlide(0);
    viewer.showModal();
  }

  viewerImg.addEventListener('load', () => viewerImg.classList.add('ready'));
  document.getElementById('viewer-prev').addEventListener('click', () => showSlide(slide - 1));
  document.getElementById('viewer-next').addEventListener('click', () => showSlide(slide + 1));
  document.getElementById('viewer-close').addEventListener('click', () => viewer.close());
  viewer.addEventListener('click', (e) => { if (e.target === viewer) viewer.close(); });   // the dim area around the panel
  viewer.addEventListener('close', () => viewerImg.removeAttribute('src'));
  viewer.addEventListener('keydown', (e) => {
    if (shown.images.length < 2) return;
    if (e.key === 'ArrowLeft') showSlide(slide - 1);
    if (e.key === 'ArrowRight') showSlide(slide + 1);
  });
  // Swipe left / right on touch screens.
  let swipeX = null;
  const stage = document.getElementById('viewer-stage');
  stage.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') swipeX = e.clientX; });
  stage.addEventListener('pointerup', (e) => {
    if (swipeX === null || shown.images.length < 2) return;
    const dx = e.clientX - swipeX;
    swipeX = null;
    if (Math.abs(dx) > 50) showSlide(slide + (dx < 0 ? 1 : -1));
  });

  function renderOcs(ocs) {
    const list = document.getElementById('ocs-list');
    if (!ocs.length) return empty(list);
    for (const oc of ocs) {
      const card = el('article', 'card');
      if (oc.from && oc.to) {
        card.style.setProperty('--from', oc.from);
        card.style.setProperty('--to', oc.to);
      }
      card.append(img(oc.images[0].src, oc.name), el('div', 'card-band'), el('div', 'card-name', oc.name));
      const hit = hitbox(card, { title: oc.name, description: oc.description, images: oc.images });
      hit.classList.add('card-hit');
      list.appendChild(hit);
      lazy.observe(card);
    }
  }

  // "2026-05-07" -> "5/7/26"
  const shortDate = (iso) => {
    const [y, m, d] = iso.split('-');
    return `${+m}/${+d}/${y.slice(2)}`;
  };

  // One art card: blurred copy, photo, title + date (see .art-card). The .art-fx box is what scales
  // on hover; the glass rim (glass.js) goes inside it, next to the card, so it scales along.
  function renderCard(piece) {
    const cover = piece.images[0];
    const blurred = img(cover.src, '');
    blurred.className = 'art-blur';
    const photo = el('div', 'art-photo');
    photo.appendChild(img(cover.src, piece.title));
    const date = el('time', 'art-date', shortDate(piece.date));
    date.dateTime = piece.date;
    const info = el('div', 'art-info');
    info.append(el('h3', 'art-title', piece.title), date);
    const card = el('article', 'art-card glass-secondary');
    card.append(blurred, photo, info);
    lazy.observe(card);
    const box = el('div', 'art-fx');
    box.style.width = `${cardWidth(cover)}rem`;
    box.appendChild(card);
    return hitbox(box, piece);
  }

  // Card width (rem) for a fixed 447-tall photo: the art's aspect ratio, kept between 160 and the
  // full 1152 row (a wider panorama is cropped to fit). 320 if the size is unknown.
  const PHOTO_H = 23.281, ROW_W = 60, GAP = 1.667, MIN_W = 8.333;
  const cardWidth = (image) => image.width && image.height
    ? Math.min(ROW_W, Math.max(MIN_W, PHOTO_H * image.width / image.height))
    : 16.667;

  // Pieces arrive newest first and fill rows in order, across years: a row takes cards until the
  // next one would overflow the 1152 width (rem, so it's the same at every window size). Each row is
  // labeled with the date of its first (newest) piece. The first card of each year gets
  // id="y<year>" for the sidebar link (on the card, not the row: one row can hold two years' starts).

  function renderRow(items) {
    const row = el('div', 'row');
    const date = el('time', 'row-date', shortDate(items[0].date));
    date.dateTime = items[0].date;
    const tl = el('div', 'row-tl');
    tl.appendChild(el('span', 'row-end'));
    const cards = el('div', 'row-cards');
    for (const piece of items) cards.appendChild(renderCard(piece));
    row.append(date, tl, cards);
    return row;
  }

  function renderRows(pieces) {
    const rows = document.getElementById('rows');
    const years = document.getElementById('years');
    if (!pieces.length) return empty(rows);
    let row = [], used = 0;
    for (const piece of pieces) {
      const w = cardWidth(piece.images[0]);
      if (row.length && used + GAP + w > ROW_W + 0.01) {
        rows.appendChild(renderRow(row));
        row = []; used = 0;
      }
      used += (row.length ? GAP : 0) + w;
      row.push(piece);
    }
    if (row.length) rows.appendChild(renderRow(row));
    const cards = rows.querySelectorAll('.art-hit');
    pieces.forEach((piece, i) => {
      const year = piece.date.slice(0, 4);
      if (document.getElementById('y' + year)) return;
      cards[i].id = 'y' + year;
      const link = el('a', '', year);
      link.href = '#y' + year;
      years.appendChild(el('li')).appendChild(link);
    });
  }

  fetch('/api/art')
    .then((res) => res.json())
    .then(({ ocs, pieces }) => { renderOcs(ocs); renderRows(pieces); })
    .catch(() => { empty(document.getElementById('ocs-list')); empty(document.getElementById('rows')); })
    .finally(() => window.glassRims?.());   // rims for the cards that were just added
</script>
<script src="/lib/sidebar.js"></script>
<script src="/lib/glass.js"></script>
<script src="/lib/dock.js"></script>
</body>
</html>
