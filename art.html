<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art | stellehosted.dev</title>
<link rel="icon" href="/branding/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/branding/favicon.png" type="image/png" sizes="256x256">
<link rel="apple-touch-icon" href="/branding/apple-touch-icon.png">
<link rel="stylesheet" href="/font.css">
<link rel="stylesheet" href="/sidebar.css">
<style>
  /* Same unit system as home.html: 1rem == 1 real Sketch unit on the 1920x1080 canvas, so every measurement below is the Sketch ("Art" frame) value / 19.2. Asset URLs are absolute because this page is served at /art (and /art/). */
  html {
    font-size: min(1vw, 1.7778vh);
  }


  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #06060c;
    font-family: 'FuturaNowHeadline', sans-serif;
    color: #fff;
    overflow: hidden;
    position: relative;
  }
  a { color: inherit; text-decoration: none; }

  .bg {
    position: fixed; inset: 0; z-index: 0;
    background-image: url('/branding/Banner (Personal).png');
    background-size: cover;
    background-position: center;
  }

  /* ===== layers, back to front (DOM order): .bg, .scroller, then the sidebar (its blur strip +
     nav, from sidebar.js), then the dock (appended to <body> by dock.js, along with its own blur strip).
     Neither component has a transform / z-index, or the dock rims' overlay blend would stop seeing
     the page. They rely on being later in the DOM to paint over the scroller. */

  /* ===== scrolling content ===== */
  /* Covers the whole window, so content scrolls all the way up to the top edge and down under the
     dock's blur on tall screens (not just within the 16:9 canvas). Full width so the wheel works
     anywhere. --canvas-top is where the canvas starts: the letterbox bar above it when the window
     is taller than 16:9, otherwise 0. */
  .scroller {
    --canvas-top: calc(50vh - 28.125rem);
    position: fixed; inset: 0;
    overflow-y: auto; overflow-x: hidden;
    scrollbar-width: none;
  }
  .scroller::-webkit-scrollbar { display: none; }
  @media (prefers-reduced-motion: no-preference) { .scroller { scroll-behavior: smooth; } }

  /* Content column: x=600, 1220 wide, first heading at y=100 *of the canvas* (hence the top padding
     includes the letterbox bar). Bottom padding lets the last stop scroll clear of the dock. */
  .content {
    width: 63.542rem;
    margin-left: calc(50% - 50rem + 31.25rem);
    padding: calc(var(--canvas-top) + 5.208rem) 0 12rem;
  }
  .content section { scroll-margin-top: calc(var(--canvas-top) + 5.208rem); }
  .content h2 { font-size: 2.0833rem; }   /* class="glow-text" comes from sidebar.css */

  /* OC's: 385x500 cards, gap 32. The shape is fixed, so one card (or four) never stretches or
     squashes; three fill the row and more wrap onto the next. */
  .ocs { display: flex; flex-wrap: wrap; gap: 1.667rem; margin-top: 1.042rem; }
  .card {
    position: relative; flex: 0 0 20.069rem;
    aspect-ratio: 385 / 500;
    border-radius: 0.417rem;
    overflow: hidden;
    background: linear-gradient(to bottom right, var(--from), var(--to));
  }
  /* Drop an <img> in a card and it fills it: <article class="card"><img src="..."> */
  .card > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* "Name BG": 137px frosted band, slanted top edge (points from the Sketch shape) */
  .card-band {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 7.167rem;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(0.833rem);
    -webkit-backdrop-filter: blur(0.833rem);
    clip-path: polygon(0 100%, 0 44.78%, 99.83% 0, 100% 100%);
  }
  .card-name {
    position: absolute; right: 2.5rem; bottom: 1.667rem;
    font-size: 2.0833rem; font-weight: 700; line-height: 1.1;
    color: #fff;
    /* 4px outside stroke: a centered stroke of 8px painted *under* the fill */
    -webkit-text-stroke: 0.4167rem #141414;
    paint-order: stroke fill;
    stroke-linejoin: round;
  }

  /* More: timeline. Each .stop is one piece of art: [art 375x500] [timeline column 32] [title/date].
     The line runs unbroken from one stop to the next (see the margin note below). */
  .more { margin-top: 3.333rem; }
  .stops { margin-top: 1.042rem; }
  .stop {
    display: grid;
    grid-template-columns: 19.531rem 3.333rem 1.667rem 1.667rem 1fr;   /* art | 64 gap | timeline | 32 gap | text */
    scroll-margin-top: calc(var(--canvas-top) + 5.208rem);
  }
  /* The 64px between stops is margin on the art, not padding on the row, so it's *inside* the row
     and the timeline column (which stretches to the row's height) spans it. */
  .stop:not(:last-child) .stop-art { margin-bottom: 3.333rem; }
  /* Fixed 375px wide; the height follows the art's own aspect ratio (set inline from the file's
     size, so the box is the right shape before a lazy image has loaded). */
  .stop-art {
    position: relative;
    align-self: start;
    aspect-ratio: 375 / 500;
    border-radius: 0.417rem;
    overflow: hidden;
    box-shadow: 0 0 1.667rem rgba(0,0,0,0.5);
    background: linear-gradient(to bottom right, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
  }
  .stop-art > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* The "stop": a 32px ring with 5px lines above and below, ring centered 80px down the row.
     The ring is hollow, so the two lines are separate pieces that end at its edges. */
  .tl { position: relative; grid-column: 3; }
  .tl::before, .tl::after {
    content: "";
    position: absolute; left: calc(50% - 0.1302rem);
    width: 0.2604rem;
    background: #fff;
  }
  .tl::before { top: 0; height: 3.333rem; }
  .tl::after  { top: 5rem; bottom: 0; }
  .stop:last-child .tl::after { display: none; }
  .tl-dot {
    position: absolute; left: 0; top: 3.333rem;
    width: 1.667rem; height: 1.667rem;
    border: 0.2604rem solid #fff;
    border-radius: 50%;
  }

  /* Text block: title's vertical center lines up with the ring's center (58px + half a 44px line) */
  .stop-text { grid-column: 5; padding-top: 3.021rem; }
  .stop-title { font-size: 2.0833rem; font-weight: 700; line-height: 1.1; }
  .stop-date { display: block; font-size: 1.0417rem; line-height: 1.6; }
  /* "Load more" row: a stop without art, so the timeline line keeps running through it. It ends at
     the button's middle when it's the last row on the page. */
  .stop-more .tl::before { top: 0; bottom: 0; height: auto; }
  .stop-more .tl::after { display: none; }
  .stop-more:last-child .tl::before { bottom: 50%; }
  .stop-more:not(:last-child) .more-btn { margin-bottom: 3.333rem; }
  .more-btn {
    grid-column: 5; justify-self: start; align-self: center;
    font: inherit; font-size: 1.0417rem; font-weight: 700; color: #fff;
    background: rgba(255,255,255,0.1);
    border: 0; border-radius: 0.417rem;
    padding: 0.729rem 1.667rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .more-btn:hover { background: rgba(255,255,255,0.2); }
  /* Every card / stop opens the viewer. The art's own button covers it; the title is a button too. */
  .art-open {
    position: absolute; inset: 0; width: 100%; height: 100%;
    padding: 0; border: 0; background: none; cursor: pointer;
  }
  .art-open:focus-visible { outline: 0.208rem solid #fff; outline-offset: -0.208rem; }
  .title-open {
    font: inherit; color: inherit; text-align: left;
    padding: 0; border: 0; background: none; cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .title-open:hover { opacity: 0.7; }
  .title-open:focus-visible { outline: 0.208rem solid #fff; outline-offset: 0.208rem; }
  /* "3 images" pill on art that opens into a carousel */
  .multi-badge {
    position: absolute; top: 0.833rem; right: 0.833rem;
    padding: 0.208rem 0.625rem; border-radius: 1rem;
    font-size: 0.833rem; font-weight: 700; line-height: 1.4;
    background: rgba(0,0,0,0.55);
    pointer-events: none;
  }

  /* ===== viewer: a modal <dialog> (Esc, focus trap and the inert page behind it come for free) =====
     Image / carousel on the left, title + date + description on the right. */
  .viewer {
    padding: 0; border: 0;
    max-width: none; max-height: none;
    font-family: inherit; color: #fff;
  }
  .viewer[open] {
    display: grid; grid-template-columns: minmax(0, 1fr) 22.917rem; grid-template-rows: minmax(0, 1fr);
    width: 72rem; height: 46rem;
    margin: auto;
    overflow: hidden;
    border-radius: 0.625rem;
    background: rgba(14,14,22,0.8);
    backdrop-filter: blur(1.667rem); -webkit-backdrop-filter: blur(1.667rem);
    box-shadow: 0 0 3.333rem rgba(0,0,0,0.6);
  }
  .viewer::backdrop { background: rgba(0,0,0,0.55); backdrop-filter: blur(0.625rem); -webkit-backdrop-filter: blur(0.625rem); }
  .viewer-stage {
    position: relative; min-width: 0;
    background: rgba(0,0,0,0.3);
    touch-action: pan-y;
  }
  .viewer-stage img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: contain; transition: opacity 0.2s ease; }
  .viewer-stage img:not(.ready) { opacity: 0; }   /* no broken-image alt text while a big file loads */
  .viewer button { font: inherit; color: #fff; cursor: pointer; border: 0; }
  .viewer button:focus-visible { outline: 0.208rem solid #fff; outline-offset: 0.104rem; }
  .v-nav, .v-close {
    position: absolute;
    display: grid; place-items: center;
    width: 2.5rem; height: 2.5rem; padding: 0; border-radius: 50%;
    background: rgba(0,0,0,0.45);
    transition: background 0.15s ease;
  }
  .v-nav:hover, .v-close:hover { background: rgba(0,0,0,0.7); }
  .v-nav svg, .v-close svg { width: 1.25rem; height: 1.25rem; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .v-nav { top: calc(50% - 1.25rem); }
  .v-prev { left: 0.833rem; }
  .v-next { right: 0.833rem; }
  .v-close { top: 0.833rem; right: 0.833rem; z-index: 1; }
  .v-dots {
    position: absolute; left: 0; right: 0; bottom: 0.833rem;
    width: fit-content; margin: 0 auto;
    display: flex; gap: 0.521rem;
    padding: 0.417rem 0.625rem; border-radius: 1rem;
    background: rgba(0,0,0,0.45);   /* readable on any art */
  }
  .v-dots button { width: 0.625rem; height: 0.625rem; padding: 0; border-radius: 50%; background: rgba(255,255,255,0.4); }
  .v-dots button[aria-current="true"] { background: #fff; }
  .viewer.single .v-nav, .viewer.single .v-dots { display: none; }
  .viewer-info {
    display: flex; flex-direction: column; gap: 0.625rem;
    padding: 3.333rem 2.083rem 2.083rem;
    overflow-y: auto;
  }
  .viewer-title { font-size: 2.0833rem; }
  .viewer-date { font-size: 1.0417rem; opacity: 0.8; }
  .viewer-desc { margin-top: 1.042rem; font-size: 1.0417rem; line-height: 1.6; }
  .viewer-desc p + p { margin-top: 1.042rem; }
  .viewer-desc p { white-space: pre-line; }
  .empty { margin-top: 1.042rem; font-size: 1.0417rem; opacity: 0.6; }
</style>
</head>
<body>

<div class="bg"></div>
<main class="scroller">
  <div class="content">

    <section id="ocs">
      <h2 class="glow-text">OC’s</h2>
      <div class="ocs" id="ocs-list"></div>
    </section>

    <section id="more" class="more">
      <h2 class="glow-text">More</h2>
      <div class="stops" id="stops"></div>
    </section>

  </div>
</main>

<nav class="sidebar">
  <h1 class="sidebar-title">Art</h1>
  <a class="sidebar-heading" href="#ocs">OC’s</a>
  <div class="sidebar-group">
    <a class="sidebar-heading" href="#more">More</a>
    <ul class="sidebar-list" id="years"></ul>
  </div>
</nav>

<dialog class="viewer" id="viewer" aria-labelledby="viewer-title">
  <div class="viewer-stage" id="viewer-stage">
    <img id="viewer-img" alt="">
    <button type="button" class="v-nav v-prev" id="viewer-prev" aria-label="Previous image"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button type="button" class="v-nav v-next" id="viewer-next" aria-label="Next image"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="v-dots" id="viewer-dots"></div>
  </div>
  <div class="viewer-info">
    <h2 class="glow-text viewer-title" id="viewer-title"></h2>
    <time class="viewer-date" id="viewer-date"></time>
    <div class="viewer-desc" id="viewer-desc"></div>
  </div>
  <button type="button" class="v-close" id="viewer-close" aria-label="Close" autofocus><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</dialog>

<script>
  // Content comes from the server's /api/art, which lists whatever is in content/art (see README
  // "Adding content"). Everything is built with textContent / DOM nodes, never innerHTML.
  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  const img = (src, alt) => {
    const node = el('img');
    node.src = src; node.alt = alt;
    node.loading = 'lazy'; node.decoding = 'async';
    return node;
  };
  const empty = (parent) => parent.appendChild(el('p', 'empty', 'Nothing here yet.'));

  // The invisible button over a card / stop's art that opens the viewer, plus a "3 images" pill
  // when the entry is a carousel. Returns nodes for the caller to append to the art.
  function openers(entry) {
    const button = el('button', 'art-open');
    button.type = 'button';
    button.setAttribute('aria-label', `View ${entry.title}`);
    button.addEventListener('click', () => openViewer(entry));
    const nodes = [button];
    if (entry.images.length > 1) nodes.unshift(el('span', 'multi-badge', `${entry.images.length} images`));
    return nodes;
  }

  // ---- viewer: a modal <dialog> with a carousel and the description ----
  const viewer = document.getElementById('viewer');
  const viewerImg = document.getElementById('viewer-img');
  const viewerDots = document.getElementById('viewer-dots');
  let shown = null;   // the entry being viewed
  let slide = 0;

  function showSlide(i) {
    const images = shown.images;
    slide = (i + images.length) % images.length;
    viewerImg.classList.remove('ready');
    viewerImg.src = images[slide].src;
    viewerImg.alt = images.length > 1 ? `${shown.title}, image ${slide + 1} of ${images.length}` : shown.title;
    [...viewerDots.children].forEach((dot, n) => dot.setAttribute('aria-current', n === slide));
    if (images.length > 1) new Image().src = images[(slide + 1) % images.length].src;   // warm up the next one
  }

  function openViewer(entry) {
    shown = entry;
    viewer.classList.toggle('single', entry.images.length === 1);
    viewerDots.replaceChildren(...entry.images.map((_, n) => {
      const dot = el('button');
      dot.type = 'button';
      dot.setAttribute('aria-label', `Image ${n + 1}`);
      dot.addEventListener('click', () => showSlide(n));
      return dot;
    }));
    document.getElementById('viewer-title').textContent = entry.title;
    const date = document.getElementById('viewer-date');
    date.textContent = entry.date ? shortDate(entry.date) : '';
    date.hidden = !entry.date;
    if (entry.date) date.dateTime = entry.date;
    // Blank lines separate paragraphs; single line breaks are kept (white-space: pre-line).
    document.getElementById('viewer-desc').replaceChildren(
      ...(entry.description ? entry.description.split(/\n\s*\n/).map((p) => el('p', '', p.trim())) : []));
    showSlide(0);
    viewer.showModal();
  }

  viewerImg.addEventListener('load', () => viewerImg.classList.add('ready'));
  document.getElementById('viewer-prev').addEventListener('click', () => showSlide(slide - 1));
  document.getElementById('viewer-next').addEventListener('click', () => showSlide(slide + 1));
  document.getElementById('viewer-close').addEventListener('click', () => viewer.close());
  viewer.addEventListener('click', (e) => { if (e.target === viewer) viewer.close(); });   // the dim area around the panel
  viewer.addEventListener('close', () => viewerImg.removeAttribute('src'));
  viewer.addEventListener('keydown', (e) => {
    if (shown.images.length < 2) return;
    if (e.key === 'ArrowLeft') showSlide(slide - 1);
    if (e.key === 'ArrowRight') showSlide(slide + 1);
  });
  // Swipe left / right on touch screens.
  let swipeX = null;
  const stage = document.getElementById('viewer-stage');
  stage.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') swipeX = e.clientX; });
  stage.addEventListener('pointerup', (e) => {
    if (swipeX === null || shown.images.length < 2) return;
    const dx = e.clientX - swipeX;
    swipeX = null;
    if (Math.abs(dx) > 50) showSlide(slide + (dx < 0 ? 1 : -1));
  });

  function renderOcs(ocs) {
    const list = document.getElementById('ocs-list');
    if (!ocs.length) return empty(list);
    for (const oc of ocs) {
      const card = el('article', 'card');
      if (oc.from && oc.to) {
        card.style.setProperty('--from', oc.from);
        card.style.setProperty('--to', oc.to);
      }
      card.append(img(oc.images[0].src, oc.name), el('div', 'card-band'), el('div', 'card-name', oc.name));
      card.append(...openers({ title: oc.name, description: oc.description, images: oc.images }));
      list.appendChild(card);
    }
  }

  // "2026-05-07" -> "5/7/26"
  const shortDate = (iso) => {
    const [y, m, d] = iso.split('-');
    return `${+m}/${+d}/${y.slice(2)}`;
  };

  function renderStop(piece, id) {
    const stop = el('article', 'stop');
    if (id) stop.id = id;
    const cover = piece.images[0];
    const art = el('div', 'stop-art');
    if (cover.width && cover.height) art.style.aspectRatio = `${cover.width} / ${cover.height}`;
    art.append(img(cover.src, piece.title), ...openers(piece));
    const dot = el('div', 'tl');
    dot.appendChild(el('span', 'tl-dot'));
    const date = el('time', 'stop-date', shortDate(piece.date));
    date.dateTime = piece.date;
    const text = el('div', 'stop-text');
    const title = el('h3', 'stop-title');
    const titleButton = el('button', 'title-open', piece.title);
    titleButton.type = 'button';
    titleButton.addEventListener('click', () => openViewer(piece));
    title.appendChild(titleButton);
    text.append(title, date);
    stop.append(art, dot, text);
    return stop;
  }

  // Each year starts with PAGE_SIZE stops and a "Load more" button for the rest; images load lazily as
  // they scroll near the screen. Pieces arrive newest first. The first stop of each year gets
  // id="y<year>" for the sidebar link.
  const PAGE_SIZE = 4;

  function renderYear(year, items, stops) {
    const end = document.createComment(year);   // everything for this year is inserted before this
    stops.appendChild(end);
    let shown = 0;
    let moreRow = null;

    const showMore = () => {
      const firstNew = shown;
      let firstStop = null;
      for (const piece of items.slice(shown, shown + PAGE_SIZE)) {
        const stop = renderStop(piece, shown === 0 ? 'y' + year : '');
        firstStop ??= stop;
        end.before(stop);
        shown++;
      }
      moreRow?.remove();
      moreRow = null;
      if (shown < items.length) {
        const button = el('button', 'more-btn', 'Load more');
        button.type = 'button';
        button.addEventListener('click', showMore);
        const dot = el('div', 'tl');
        moreRow = el('div', 'stop stop-more');
        moreRow.append(dot, button);
        end.before(moreRow);
        if (firstNew > 0) button.focus({ preventScroll: true });
      } else if (firstNew > 0) {
        firstStop.tabIndex = -1;   // the button is gone: hand focus to the first stop that appeared
        firstStop.focus({ preventScroll: true });
      }
    };
    showMore();
  }

  function renderStops(pieces) {
    const stops = document.getElementById('stops');
    const years = document.getElementById('years');
    if (!pieces.length) return empty(stops);
    const byYear = new Map();
    for (const piece of pieces) {
      const year = piece.date.slice(0, 4);
      if (!byYear.has(year)) byYear.set(year, []);
      byYear.get(year).push(piece);
    }
    for (const [year, items] of byYear) {
      const link = el('a', '', year);
      link.href = '#y' + year;
      years.appendChild(el('li')).appendChild(link);
      renderYear(year, items, stops);
    }
  }

  fetch('/api/art')
    .then((res) => res.json())
    .then(({ ocs, pieces }) => { renderOcs(ocs); renderStops(pieces); })
    .catch(() => { empty(document.getElementById('ocs-list')); empty(document.getElementById('stops')); });
</script>
<script src="/sidebar.js"></script>
<script src="/dock.js"></script>
</body>
</html>
