<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art | stellehosted.dev</title>
<link rel="icon" href="/branding/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/branding/favicon.png" type="image/png" sizes="256x256">
<link rel="apple-touch-icon" href="/branding/apple-touch-icon.png">
<link rel="stylesheet" href="/lib/font/font.css">
<link rel="stylesheet" href="/lib/styles/text.css">
<link rel="stylesheet" href="/lib/components/sidebar.css">
<link rel="stylesheet" href="/lib/styles/glass.css">
<link rel="stylesheet" href="/lib/components/dialog.css">
<link rel="stylesheet" href="/lib/effects/cardFx.css">
<style>
  /* Same unit system as home.html: 1rem == 1 real Sketch unit on the 1920x1080 canvas, so every measurement below is the Sketch ("Art" frame) value / 19.2. Asset URLs are absolute because this page is served at /art (and /art/). */
  /* The document itself scrolls (no inner scroll box): a position:fixed scroller would be an
     isolated group, and the glass rims' overlay blend (glass.js) would stop seeing the page. */
  html {
    font-size: min(1vw, 1.7778vh);
    scrollbar-width: none;
  }
  html::-webkit-scrollbar { display: none; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #06060c;
    font-family: 'FuturaNowHeadline', sans-serif;
    color: #fff;
  }
  a { color: inherit; text-decoration: none; }

  .bg {
    position: fixed; inset: 0; z-index: -1;   /* under the in-flow content */
    background-image: url('/branding/Banner (Personal).png');
    background-size: cover;
    background-position: center;
  }

  /* ===== layers, back to front (DOM order): .bg (fixed, z -1), the content (scrolls with the
     document), then the sidebar (its blur strip + nav, from sidebar.js), then the dock (appended to
     <body> by dock.js, along with its own blur strip). Neither component has a transform / z-index,
     or the dock rims' overlay blend would stop seeing the page. They rely on being later in the DOM
     to paint over the content. */

  /* Content column: x=502, first heading 100px (5.208rem) below the top of the *window*, so on a
     tall window it doesn't sink into the letterbox bar the way the centered sidebar does. Bottom
     padding lets the last row scroll clear of the dock. */
  .content {
    position: relative;
    width: 67.708rem;
    margin-left: calc(50% - 50rem + 26.146rem);
    padding: 5.208rem 0 12rem;
  }
  .content section { scroll-margin-top: 5.208rem; }

  /* OC's: 385x500 cards, gap 32, in a Glass panel (glass.css: radius 24, padding 40).
     The card shape is fixed; the panel shrinks to fit fewer than three and wraps more. */
  .ocs {
    display: flex; flex-wrap: wrap; gap: 1.667rem;
    width: fit-content; max-width: 100%;
    margin-top: 1.042rem;
    padding: 2.083rem;
  }
  .card-hit { flex: 0 0 auto; width: 20.069rem; }   /* a real width, so the panel's fit-content sees it */
  .card {
    position: relative; display: block; width: 100%;
    aspect-ratio: 385 / 500;
    border-radius: 0.417rem;
    overflow: hidden;
    background: linear-gradient(to bottom right, var(--from), var(--to));
  }
  /* The art fills the card. A cut-out (transparent png) gets the Sketch "Hero" offset shadow in the
     card's start color; on an opaque image it's hidden behind the image itself. */
  .card > img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    filter: drop-shadow(-1.042rem -0.417rem 0 var(--from, transparent));
  }
  /* "Name BG": 137px frosted band, slanted top edge (points from the Sketch shape). It's a blurred
     copy of the card's own art, not a backdrop-filter: Safari renders a backdrop blur in tiles and
     sometimes leaves some of them stale after the image loads, so the band looked progressively less
     blurred toward the bottom until something repainted it. The copy is clipped to the same shape,
     and scaled a little so the blur's own faded edge falls outside the card (overflow: hidden). */
  .card-band {
    position: absolute; inset: 0;
    clip-path: polygon(0 100%, 0 calc(100% - 3.958rem), 99.83% calc(100% - 7.167rem), 100% 100%);
  }
  .card-band::after {   /* the band's white 5% tint, over the blurred copy */
    content: ""; position: absolute; inset: 0;
    background: rgba(255,255,255,0.05);
  }
  .band-blur {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover;
    filter: blur(0.833rem);
    transform: scale(1.06);
    will-change: filter, transform;
  }
  .band-blur:not(.loaded) { filter: none; }   /* same reasoning as .art-blur: blur the loaded picture */
  .card-name {
    /* The padding gives the 4px outside stroke (and the hover glow, a filter) room inside the element's
       box: a filter clips to the box, and the stroke sticks out past a bare line box. The offsets
       are the original right/bottom (2.5rem, 1.667rem) minus the padding, so the text doesn't move. */
    --pad: 0.833rem;
    position: absolute; right: calc(2.5rem - var(--pad)); bottom: calc(1.667rem - var(--pad));
    padding: var(--pad);
    font-size: 2.0833rem; font-weight: 700; line-height: 1.1;
    color: #fff;
    /* 4px outside stroke: a centered stroke of 8px painted *under* the fill */
    -webkit-text-stroke: 0.4167rem #141414;
    paint-order: stroke fill;
    stroke-linejoin: round;
  }

  /* More: a timeline of rows of art cards.
     Each row: [date, right-aligned to x=570] 15 [16px timeline] 49 [cards, gap 32, 1152 wide].
     Every card's photo is the same height (447, as in Sketch); its width follows the art's aspect
     ratio, and the script fills each row with as many cards as fit the 1152. */
  .more { margin-top: 4.375rem; }   /* 84 below the OC panel */
  .rows { margin-top: 1.042rem; }
  .row {
    display: grid;
    grid-template-columns: 3.542rem 0.781rem 0.833rem 2.552rem 1fr;
  }
  /* Year links land on a card; the extra 16px puts its row's dot at the usual 100px from the top. */
  .row-cards > .art-hit { scroll-margin-top: calc(5.208rem + 0.833rem); }
  .row-date {
    grid-column: 1; justify-self: end;
    margin-top: 0.208rem;
    white-space: nowrap;
  }
  /* The timeline: a 16px dot at the top of each row, and a 5px line from it down to the next row's
     dot. The last row closes with a second dot just below it, so the line never trails off. */
  .row-tl { grid-column: 3; position: relative; }
  .row-tl::before, .row-end {
    content: "";
    position: absolute; left: 0; top: 0;
    width: 0.833rem; height: 0.833rem;
    border-radius: 50%;
    background: #fff;
  }
  .row-tl::after {
    content: "";
    position: absolute; left: calc(50% - 0.13rem); top: 0.833rem; bottom: 0;
    width: 0.26rem;
    background: #fff;
  }
  .row-end { top: 100%; }
  .row:not(:last-child) .row-end { display: none; }
  /* Cards start 16px below the dot; 16px under them (+16 at the top of the next row) makes the
     32px row gap. */
  .row-cards {
    grid-column: 5;
    display: flex; gap: 1.667rem; align-items: flex-start;
    padding: 0.833rem 0;
  }

  /* Art card: Glass, radius 16. Photo 447 tall; the card's width is set inline from the
     file's size (see renderCard), so the box is the right shape before its image has loaded. Then
     the title and date. Behind the photo sits a 16px-blurred copy of it, scaled 1.05x, which bleeds the art's
     colors down into the frosted area under it. */
  .art-hit .art-fx { display: block; position: relative; width: 16.667rem; }   /* 320 when the size is unknown */
  .art-card {
    --glass-radius: 0.833;
    position: relative;
    display: flex; flex-direction: column; gap: 0.833rem;
    padding-bottom: 0.833rem;
    overflow: hidden;
  }
  .art-photo {
    position: relative;
    height: 23.281rem;   /* 447 */
    border-radius: 0.417rem;
    overflow: hidden;
  }
  .art-photo > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .art-blur {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 23.281rem;
    object-fit: cover;
    filter: blur(0.833rem);   /* 16px */
    transform: scale(1.05);   /* a little bigger than the photo, so more of the color bleeds out */
    will-change: filter, transform;   /* its own layer, so Safari rasterizes the blur once, at full size */
  }
  /* Safari sometimes keeps the blur it computed for the empty image (before the file arrived) and
     draws the loaded picture scaled but with hard, un-faded edges until something repaints it. So the
     filter is only switched on once the image has loaded (the script adds .loaded). */
  .art-blur:not(.loaded) { filter: none; }
  .art-info {
    position: relative;
    display: flex; flex-direction: column; gap: 0.417rem;
    padding: 0 0.833rem;
    text-align: center;
  }
  /* Off-screen images have their src removed (see the observer in the script): no alt-text flash. */
  img:not([src]) { visibility: hidden; }

  /* Hover: cardFx (lib/effects/cardFx.css) (.art-hit is the hitbox, the cards are .card-fx). */
  .art-hit { position: relative; }
  /* Every card opens the dialog: an invisible button covers it. */
  .art-open {
    position: absolute; inset: 0; width: 100%; height: 100%;
    padding: 0; border: 0; background: none; cursor: pointer;
  }
  .art-open:focus-visible { outline: 0.208rem solid #fff; outline-offset: 0.208rem; border-radius: 0.833rem; }
  /* "3 images" pill on art that opens into a carousel */
  .multi-badge {
    position: absolute; top: 0.833rem; right: 0.833rem;
    padding: 0.208rem 0.625rem; border-radius: 1rem;
    font-size: 0.833rem; font-weight: 700; line-height: 1.4;
    background: rgba(0,0,0,0.55);
    pointer-events: none;
  }

  .empty { margin-top: 1.042rem; font-size: 1.0417rem; opacity: 0.6; }
</style>
</head>
<body>

<div class="bg"></div>
<main class="content">

  <section id="ocs">
    <h2 class="heading">OC’s</h2>
    <div class="ocs glass" id="ocs-list"></div>
  </section>

  <section id="more" class="more">
    <h2 class="heading">More</h2>
    <div class="rows" id="rows"></div>
  </section>

</main>

<nav class="sidebar">
  <h1 class="title sidebar-title">Art</h1>
  <a class="sidebar-heading" href="#ocs">OC’s</a>
  <div class="sidebar-group">
    <a class="sidebar-heading" href="#more">More</a>
    <ul class="sidebar-list" id="years"></ul>
  </div>
</nav>

<script src="/lib/vendor/marked.umd.js"></script>
<script>
  // Content comes from the server's /api/art, which lists whatever is in content/art (see README
  // "Adding content"). Everything is built with textContent / DOM nodes, never innerHTML.
  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  // Art images load as they approach the screen and unload (src removed, so the browser can drop the
  // decoded bitmap) once they're a screen away. Every box is sized up front (fixed aspect ratio), so
  // none of this moves the layout. The observer watches the card, not the src-less <img>s in it.
  const lazy = new IntersectionObserver((entries) => {
    for (const { target, isIntersecting } of entries) {
      for (const image of target.querySelectorAll('img[data-src]')) {
        if (isIntersecting) image.src = image.dataset.src;
        else { image.removeAttribute('src'); image.classList.remove('loaded'); }
      }
    }
  }, { rootMargin: '100% 0px' });
  const img = (src, alt) => {
    const node = el('img');
    node.dataset.src = src; node.alt = alt;
    node.decoding = 'async';
    node.addEventListener('load', () => node.classList.add('loaded'));
    return node;
  };
  const empty = (parent) => parent.appendChild(el('p', 'empty', 'Nothing here yet.'));

  // Wraps a card's art in its hover hitbox: the art gets a "3 images" pill when the entry is a
  // carousel, and the invisible button over it opens the dialog. Returns the hitbox.
  function hitbox(art, entry) {
    if (entry.images.length > 1) art.append(el('span', 'multi-badge', `${entry.images.length} images`));
    const button = el('button', 'art-open');
    button.type = 'button';
    button.setAttribute('aria-label', `View ${entry.title}`);
    button.addEventListener('click', () => openDialog(entry));
    const wrap = el('div', 'art-hit card-fx-hit');
    wrap.append(art, button);
    return wrap;
  }

  function renderOcs(ocs) {
    const list = document.getElementById('ocs-list');
    if (!ocs.length) return empty(list);
    for (const oc of ocs) {
      const card = el('article', 'card card-fx');
      if (oc.from && oc.to) {
        card.style.setProperty('--from', oc.from);
        card.style.setProperty('--to', oc.to);
      }
      const band = el('div', 'card-band');
      const bandBlur = img(oc.images[0].src, '');
      bandBlur.className = 'band-blur';
      band.appendChild(bandBlur);
      card.append(img(oc.images[0].src, oc.name), band, el('div', 'card-name glow-fx', oc.name));
      const hit = hitbox(card, { title: oc.name, description: oc.description, images: oc.images });
      hit.classList.add('card-hit', 'glow-fx-hit');   // the name scales + glows on hover (glowFx.css)
      list.appendChild(hit);
      lazy.observe(card);
    }
  }

  // "2026-05-07" -> "5/7/26"
  const shortDate = (iso) => {
    const [y, m, d] = iso.split('-');
    return `${+m}/${+d}/${y.slice(2)}`;
  };

  // One art card: blurred copy, photo, title + date (see .art-card). The .art-fx box sizes the card
  // on hover; the glass rim (glass.js) goes inside it, next to the card, so it scales along.
  function renderCard(piece) {
    const cover = piece.images[0];
    const blurred = img(cover.src, '');
    blurred.className = 'art-blur';
    const photo = el('div', 'art-photo');
    photo.appendChild(img(cover.src, piece.title));
    const date = el('time', 'subtitle', shortDate(piece.date));
    date.dateTime = piece.date;
    const info = el('div', 'art-info');
    info.append(el('h3', 'subheading', piece.title), date);
    const card = el('article', 'art-card glass card-fx');
    card.append(blurred, photo, info);
    lazy.observe(card);
    const box = el('div', 'art-fx');
    box.style.width = `${cardWidth(cover)}rem`;
    box.appendChild(card);
    return hitbox(box, piece);
  }

  // Card width (rem) for a fixed 447-tall photo: the art's aspect ratio, kept between 160 and the
  // full 1152 row (a wider panorama is cropped to fit). 320 if the size is unknown.
  const PHOTO_H = 23.281, ROW_W = 60, GAP = 1.667, MIN_W = 8.333;
  const cardWidth = (image) => image.width && image.height
    ? Math.min(ROW_W, Math.max(MIN_W, PHOTO_H * image.width / image.height))
    : 16.667;

  // Pieces arrive newest first and fill rows in order, across years: a row takes cards until the
  // next one would overflow the 1152 width (rem, so it's the same at every window size). Each row is
  // labeled with the date of its first (newest) piece. The first card of each year gets
  // id="y<year>" for the sidebar link (on the card, not the row: one row can hold two years' starts).

  function renderRow(items) {
    const row = el('div', 'row');
    const date = el('time', 'subheading row-date', shortDate(items[0].date));
    date.dateTime = items[0].date;
    const tl = el('div', 'row-tl');
    tl.appendChild(el('span', 'row-end'));
    const cards = el('div', 'row-cards');
    for (const piece of items) cards.appendChild(renderCard(piece));
    row.append(date, tl, cards);
    return row;
  }

  function renderRows(pieces) {
    const rows = document.getElementById('rows');
    const years = document.getElementById('years');
    if (!pieces.length) return empty(rows);
    let row = [], used = 0;
    for (const piece of pieces) {
      const w = cardWidth(piece.images[0]);
      if (row.length && used + GAP + w > ROW_W + 0.01) {
        rows.appendChild(renderRow(row));
        row = []; used = 0;
      }
      used += (row.length ? GAP : 0) + w;
      row.push(piece);
    }
    if (row.length) rows.appendChild(renderRow(row));
    const cards = rows.querySelectorAll('.art-hit');
    pieces.forEach((piece, i) => {
      const year = piece.date.slice(0, 4);
      if (document.getElementById('y' + year)) return;
      cards[i].id = 'y' + year;
      const link = el('a', '', year);
      link.href = '#y' + year;
      years.appendChild(el('li')).appendChild(link);
    });
  }

  fetch('/api/art')
    .then((res) => res.json())
    .then(({ ocs, pieces }) => { renderOcs(ocs); renderRows(pieces); })
    .catch(() => { empty(document.getElementById('ocs-list')); empty(document.getElementById('rows')); })
    .finally(() => window.glassRims?.());   // rims for the cards that were just added
</script>
<script src="/lib/components/sidebar.js"></script>
<script src="/lib/styles/glass.js"></script>
<script src="/lib/components/dialog.js"></script>
<script src="/lib/components/dock.js"></script>
</body>
</html>
