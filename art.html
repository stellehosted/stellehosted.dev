<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art | stellehosted.dev</title>
<link rel="icon" href="/branding/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/branding/favicon.png" type="image/png" sizes="256x256">
<link rel="apple-touch-icon" href="/branding/apple-touch-icon.png">
<style>
  /* Same unit system as home.html: 1rem == 1 real Sketch unit on the 1920x1080 canvas, so every measurement below is the Sketch ("Art" frame) value / 19.2. Asset URLs are absolute because this page is served at /art (and /art/). */
  html {
    font-size: min(1vw, 1.7778vh);
  }

  @font-face {
    font-family: 'FuturaNowHeadline';
    src: url('/font/FuturaNowHeadline.ttf') format('truetype');
    font-weight: 400; font-style: normal;
  }
  @font-face {
    font-family: 'FuturaNowHeadline';
    src: url('/font/FuturaNowHeadlineItalic.ttf') format('truetype');
    font-weight: 400; font-style: italic;
  }
  @font-face {
    font-family: 'FuturaNowHeadline';
    src: url('/font/FuturaNowHeadlineBold.ttf') format('truetype');
    font-weight: 700; font-style: normal;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #06060c;
    font-family: 'FuturaNowHeadline', sans-serif;
    color: #fff;
    overflow: hidden;
    position: relative;
  }
  a { color: inherit; text-decoration: none; }

  .bg {
    position: fixed; inset: 0; z-index: 0;
    background-image: url('/branding/Banner (Personal).png');
    background-size: cover;
    background-position: center;
  }

  /* ===== layers, back to front (DOM order): .bg, .sidebar-bg, .scroller, .canvas =====
     The scroller sits under .canvas, so the sidebar text paints over it, and the dock (appended to
     <body> by dock.js, along with its own blur strip) paints over everything and blurs what scrolls beneath. Same rule as home.html:
     .canvas has no transform / z-index, or the dock rims' overlay blend would stop seeing the page. */
  .canvas {
    position: absolute;
    left: calc(50% - 50rem); top: calc(50% - 28.125rem);
    width: 100rem;
    height: 56.25rem;
    pointer-events: none;   /* wheel/touch fall through to .scroller... */
  }
  .canvas .sidebar { pointer-events: auto; }   /* ...except on the clickable sidebar (the dock re-enables its own) */

  /* Sidebar BG: 384px, black 50% -> transparent left-to-right, background blur 16. Fixed and full
     height so it never stops short of the viewport on tall screens. */
  .sidebar-bg {
    position: fixed; top: 0; bottom: 0; left: 0;
    width: calc(50vw - 50rem + 20rem);   /* any letterbox bar + the 384px sidebar */
    --r: 0.833rem;
    background: linear-gradient(to right, rgba(0,0,0,0.5) calc(100% - 20rem), rgba(0,0,0,0));
  }
  /* Blur ramps from 16px at the sidebar's left edge to 0 at x=384: the same 6 stacked, masked
     backdrop-blur layers as the dock's strip, turned sideways. (One big masked layer renders in
     Safari as a hard-edged band instead of a fade.) */
  .sidebar-bg .blur { position: absolute; top: 0; bottom: 0; right: 0; width: 20rem; overflow: hidden; }
  .sidebar-bg .layer {
    position: absolute; inset: 0;
    backdrop-filter: blur(calc(var(--r) * var(--i) / 6));
    -webkit-backdrop-filter: blur(calc(var(--r) * var(--i) / 6));
    -webkit-mask-image: linear-gradient(to left, transparent calc((var(--i) - 1) * 100% / 6), #000 calc(var(--i) * 100% / 6), transparent calc((var(--i) + 1) * 100% / 6));
    mask-image: linear-gradient(to left, transparent calc((var(--i) - 1) * 100% / 6), #000 calc(var(--i) * 100% / 6), transparent calc((var(--i) + 1) * 100% / 6));
  }

  /* ===== sidebar content: vertically centered stack, left edge at x=100 ===== */
  .sidebar {
    position: absolute; left: 0; top: 0;
    width: 20rem; height: 56.25rem;
    display: flex; flex-direction: column; justify-content: center;
    padding-left: 5.208rem;
    gap: 3.333rem;
  }
  /* Headings share one look: white 75% -> 100% vertical gradient fill with a soft white glow.
     The glow is a drop-shadow filter rather than text-shadow because the fill is clipped to the
     glyphs (a text-shadow would show through the transparent fill). */
  .glow-text {
    display: inline-block;
    background: linear-gradient(to bottom, rgba(255,255,255,0.75), #fff);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    font-weight: 700;
    line-height: 1.1;
    filter: drop-shadow(0 0.208rem 0.833rem rgba(255,255,255,0.25));
  }
  .side-title { font-size: 4.1667rem; filter: drop-shadow(0 0.625rem 1.25rem rgba(255,255,255,0.25)); }
  .side-link  { font-size: 2.0833rem; }
  .side-more { display: flex; flex-direction: column; gap: 1.042rem; align-items: flex-start; }
  .side-years { display: flex; flex-direction: column; gap: 1.042rem; list-style: none; }
  .side-years a { display: block; font-size: 1.0417rem; line-height: 1.05; transition: opacity 0.15s ease; }
  .side-years a:hover, .side-link:hover { opacity: 0.7; }

  /* ===== scrolling content ===== */
  /* Starts at the top of the letterboxed canvas so nothing scrolls into the top bar, but runs to the
     bottom of the window so content also passes under the dock's blur on tall screens. Full width
     so the wheel works anywhere across it. */
  .scroller {
    position: fixed; left: 0; right: 0; bottom: 0;
    top: calc(50vh - 28.125rem);
    overflow-y: auto; overflow-x: hidden;
    scrollbar-width: none;
  }
  .scroller::-webkit-scrollbar { display: none; }
  @media (prefers-reduced-motion: no-preference) { .scroller { scroll-behavior: smooth; } }

  /* Content column: x=600, 1220 wide, first heading at y=100. Bottom padding lets the last stop
     scroll clear of the dock. */
  .content {
    width: 63.542rem;
    margin-left: calc(50% - 50rem + 31.25rem);
    padding: 5.208rem 0 12rem;
  }
  .content section { scroll-margin-top: 5.208rem; }
  .content h2 { font-size: 2.0833rem; }

  /* OC's: three 385x500 cards, gap 32 */
  .ocs { display: flex; gap: 1.667rem; margin-top: 1.042rem; }
  .card {
    position: relative; flex: 1 1 0;
    height: 26.042rem;
    border-radius: 0.417rem;
    overflow: hidden;
    background: linear-gradient(to bottom right, var(--from), var(--to));
  }
  /* Drop an <img> in a card and it fills it: <article class="card"><img src="..."> */
  .card > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* "Name BG": 137px frosted band, slanted top edge (points from the Sketch shape) */
  .card-band {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 7.167rem;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(0.833rem);
    -webkit-backdrop-filter: blur(0.833rem);
    clip-path: polygon(0 100%, 0 44.78%, 99.83% 0, 100% 100%);
  }
  .card-name {
    position: absolute; right: 2.5rem; bottom: 1.667rem;
    font-size: 2.0833rem; font-weight: 700; line-height: 1.1;
    color: #fff;
    /* 4px outside stroke: a centered stroke of 8px painted *under* the fill */
    -webkit-text-stroke: 0.4167rem #141414;
    paint-order: stroke fill;
    stroke-linejoin: round;
  }
  .card-stelle { --from: #b39ef2; --to: #6248b3; }
  .card-ace    { --from: #889bea; --to: #8616b3; }
  .card-os     { --from: #9dd4ff; --to: #24107e; }

  /* More: timeline. Each .stop is one piece of art: [art 375x500] [timeline column 32] [title/date].
     The line runs unbroken from one stop to the next (see the margin note below). */
  .more { margin-top: 3.333rem; }
  .stops { margin-top: 1.042rem; }
  .stop {
    display: grid;
    grid-template-columns: 19.531rem 3.333rem 1.667rem 1.667rem 1fr;   /* art | 64 gap | timeline | 32 gap | text */
    scroll-margin-top: 5.208rem;
  }
  /* The 64px between stops is margin on the art, not padding on the row, so it's *inside* the row
     and the timeline column (which stretches to the row's height) spans it. */
  .stop:not(:last-child) .stop-art { margin-bottom: 3.333rem; }
  .stop-art {
    position: relative;
    height: 26.042rem;
    border-radius: 0.417rem;
    overflow: hidden;
    box-shadow: 0 0 1.667rem rgba(0,0,0,0.5);
    background: linear-gradient(to bottom right, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
  }
  .stop-art > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* The "stop": a 32px ring with 5px lines above and below, ring centered 80px down the row.
     The ring is hollow, so the two lines are separate pieces that end at its edges. */
  .tl { position: relative; grid-column: 3; }
  .tl::before, .tl::after {
    content: "";
    position: absolute; left: calc(50% - 0.1302rem);
    width: 0.2604rem;
    background: #fff;
  }
  .tl::before { top: 0; height: 3.333rem; }
  .tl::after  { top: 5rem; bottom: 0; }
  .stop:last-child .tl::after { display: none; }
  .tl-dot {
    position: absolute; left: 0; top: 3.333rem;
    width: 1.667rem; height: 1.667rem;
    border: 0.2604rem solid #fff;
    border-radius: 50%;
  }

  /* Text block: title's vertical center lines up with the ring's center (58px + half a 44px line) */
  .stop-text { grid-column: 5; padding-top: 3.021rem; }
  .stop-title { font-size: 2.0833rem; font-weight: 700; line-height: 1.1; }
  .stop-date { font-size: 1.0417rem; line-height: 1.6; }
</style>
</head>
<body>

<div class="bg"></div>
<div class="sidebar-bg">
  <div class="blur">
    <div class="layer" style="--i:1"></div>
    <div class="layer" style="--i:2"></div>
    <div class="layer" style="--i:3"></div>
    <div class="layer" style="--i:4"></div>
    <div class="layer" style="--i:5"></div>
    <div class="layer" style="--i:6"></div>
  </div>
</div>

<main class="scroller">
  <div class="content">

    <section id="ocs">
      <h2 class="glow-text">OC’s</h2>
      <div class="ocs">
        <article class="card card-stelle"><div class="card-band"></div><div class="card-name">Stelle</div></article>
        <article class="card card-ace"><div class="card-band"></div><div class="card-name">Ace</div></article>
        <article class="card card-os"><div class="card-band"></div><div class="card-name">OS-tans</div></article>
      </div>
    </section>

    <section id="more" class="more">
      <h2 class="glow-text">More</h2>
      <div class="stops">
        <!-- One .stop per piece, newest first. The first stop of each year gets id="y<year>" so the
             sidebar's year links can jump to it. Everything below is placeholder content. -->
        <article class="stop" id="y2026">
          <div class="stop-art"></div>
          <div class="tl"><span class="tl-dot"></span></div>
          <div class="stop-text">
            <h3 class="stop-title">Everything I Learned and Loved</h3>
            <p class="stop-date">2026-05-07</p>
          </div>
        </article>
        <article class="stop" id="y2025">
          <div class="stop-art"></div>
          <div class="tl"><span class="tl-dot"></span></div>
          <div class="stop-text">
            <h3 class="stop-title">Untitled</h3>
            <p class="stop-date">2025-03-14</p>
          </div>
        </article>
        <article class="stop" id="y2024">
          <div class="stop-art"></div>
          <div class="tl"><span class="tl-dot"></span></div>
          <div class="stop-text">
            <h3 class="stop-title">Untitled</h3>
            <p class="stop-date">2024-08-02</p>
          </div>
        </article>
        <article class="stop" id="y2023">
          <div class="stop-art"></div>
          <div class="tl"><span class="tl-dot"></span></div>
          <div class="stop-text">
            <h3 class="stop-title">Untitled</h3>
            <p class="stop-date">2023-11-20</p>
          </div>
        </article>
      </div>
    </section>

  </div>
</main>

<div class="canvas">
  <nav class="sidebar">
    <h1 class="glow-text side-title">Art</h1>
    <a class="glow-text side-link" href="#ocs">OC’s</a>
    <div class="side-more">
      <a class="glow-text side-link" href="#more">More</a>
      <ul class="side-years">
        <li><a href="#y2026">2026</a></li>
        <li><a href="#y2025">2025</a></li>
        <li><a href="#y2024">2024</a></li>
        <li><a href="#y2023">2023</a></li>
      </ul>
    </div>
  </nav>
</div>

<script src="/dock.js"></script>
</body>
</html>
